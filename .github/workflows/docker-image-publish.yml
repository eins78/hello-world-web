# Docker Image Build and Publish
#
# This workflow builds the Docker image and publishes it to GHCR and Docker Hub.
# It runs on:
# - Pull requests (to validate Docker builds)
# - After Docker E2E tests pass on main (to publish main image)
# - Version tags (to publish release images)
# - Daily schedule (to keep base images updated)
# - Manual trigger via workflow_dispatch
#
# The workflow uses GitHub Actions cache (type=gha) which is automatically
# shared with the docker-e2e-tests workflow. On main branch, this workflow
# waits for docker-e2e-tests to complete successfully before publishing.
#
# After publishing, the image gets GitHub build provenance attestations and
# cosign signatures (job docker-build), per-platform SBOMs with a vulnerability
# scan and SBOM attestations (job sbom), and the SBOMs are attached to the
# GitHub release of version tags (job release-sbom). See docs/eu-cra-compliance.md.
# All of that is skipped on pull requests, where nothing is pushed.

name: Docker Image Build and Publish

on:
  # Trigger after Docker E2E tests pass on main
  workflow_run:
    workflows: ["Docker E2E Tests"]
    types:
      - completed
    branches:
      - main
  schedule:
    - cron: "0 10 * * *"
  push:
    tags:
      - "v*.*.*"
  pull_request: {}
  workflow_dispatch:

env:
  # the image name in Google Artifact Registry (what Cloud Run deploys)
  GAR_IMAGE: ${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPOSITORY }}/hello-world-web

jobs:
  docker-build:
    # Only run if workflow_run was successful, or if triggered by other events
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation, GitHub attestations and cosign keyless signing
      packages: write # Required for pushing the image, attestations and signatures to GHCR
      attestations: write # Required for actions/attest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        if: github.event_name != 'pull_request'
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          access_token_lifetime: 600s

      - name: Docker meta (for PRs - without GAR)
        id: meta-pr
        if: github.event_name == 'pull_request'
        uses: docker/metadata-action@v6
        with:
          # list of Docker images to use as base name for tags (PRs don't have access to GAR secrets)
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ github.repository }}
          # generate Docker tags based on the following events/attributes
          tags: |
            type=schedule
            type=edge,branch=main
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
          # pin the "created" label to the commit date (default is the build time)
          labels: |
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss[Z]'}}

      - name: Docker meta (for push - with GAR)
        id: meta-push
        if: github.event_name != 'pull_request'
        uses: docker/metadata-action@v6
        with:
          # list of Docker images to use as base name for tags
          images: |
            ghcr.io/${{ github.repository }}
            docker.io/${{ github.repository }}
            ${{ secrets.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ secrets.GAR_REPOSITORY }}/hello-world-web
          # generate Docker tags based on the following events/attributes
          tags: |
            type=schedule
            type=edge,branch=main
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=long
          # pin the "created" label to the commit date (default is the build time)
          labels: |
            org.opencontainers.image.created={{commit_date 'YYYY-MM-DDTHH:mm:ss[Z]'}}

      - name: set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: set up Docker buildx
        uses: docker/setup-buildx-action@v4

      - name: login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to Google Artifact Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set SOURCE_DATE_EPOCH from the commit date
        id: source-date
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      - name: build and push docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ github.event_name == 'pull_request' && steps.meta-pr.outputs.tags || steps.meta-push.outputs.tags }}
          labels: ${{ github.event_name == 'pull_request' && steps.meta-pr.outputs.labels || steps.meta-push.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Build multi-platform only for production (main/tags), AMD64 only for PRs
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          # BuildKit uses SOURCE_DATE_EPOCH for the image config and history timestamps
          # (the Dockerfile does not need to declare it as ARG)
          build-args: |
            SOURCE_DATE_EPOCH=${{ steps.source-date.outputs.epoch }}

      # =============================================================
      # Supply Chain Security - Attestations & Signing (SLSA Build L2)
      # =============================================================
      # The same image (same digest) was pushed to GHCR, Docker Hub and GAR.
      # GHCR and GAR get a build provenance attestation and a cosign signature,
      # Docker Hub a cosign signature. Per-platform SBOM attestations are added
      # by the sbom job below.

      # The access token from the first auth step is minted at job start with a
      # 10 minute lifetime; a multi-platform build can take longer than that.
      - name: Refresh Google Cloud credentials for signing
        id: auth-sign
        uses: google-github-actions/auth@v3
        if: github.event_name != 'pull_request'
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          access_token_lifetime: 600s

      - name: Login to Google Artifact Registry (for signing)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth-sign.outputs.access_token }}

      - name: Attest build provenance (GHCR)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event_name != 'pull_request'
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Attest build provenance (GAR)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ env.GAR_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: github.event_name != 'pull_request'

      # --recursive also signs each platform manifest, not only the index
      - name: Sign container image with Cosign (GHCR)
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes --recursive \
            ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

      - name: Sign container image with Cosign (GAR)
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes --recursive \
            "$GAR_IMAGE@${{ steps.build.outputs.digest }}"

      - name: Sign container image with Cosign (Docker Hub)
        if: github.event_name != 'pull_request'
        # TODO: remove once a publish run has shown that Docker Hub accepts the
        # OCI referrers storage that cosign 3.x uses by default
        continue-on-error: true
        run: |
          cosign sign --yes --recursive \
            docker.io/${{ github.repository }}@${{ steps.build.outputs.digest }}

  sbom:
    # =============================================================
    # EU Cyber Resilience Act (CRA) Compliance - SBOM & Security
    # =============================================================
    # One SBOM (CycloneDX + SPDX) and one vulnerability scan per platform of the
    # multi-platform image. The SPDX SBOM is attested against the platform
    # manifest digest on GHCR and GAR.
    needs: docker-build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation and GitHub attestations
      packages: write # Required for pushing attestations to GHCR
      attestations: write # Required for actions/attest
      security-events: write # Required for uploading SARIF to the Security tab
    steps:
      - name: login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
          access_token_lifetime: 600s

      - name: Login to Google Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.GAR_LOCATION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Resolve the platform manifest digest
        id: platform
        env:
          IMAGE: ghcr.io/${{ github.repository }}@${{ needs.docker-build.outputs.digest }}
          PLATFORM: linux/${{ matrix.arch }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE" --raw \
            | jq -r --arg p "$PLATFORM" '.manifests[] | select(.platform != null and (.platform.os + "/" + .platform.architecture) == $p) | .digest')
          test -n "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (CycloneDX format)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.platform.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: cyclonedx-json
          output-file: sbom.linux-${{ matrix.arch }}.cyclonedx.json
          artifact-name: sbom.linux-${{ matrix.arch }}.cyclonedx.json
          upload-release-assets: false # done by the release-sbom job below

      - name: Generate SBOM (SPDX format for compliance)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/${{ github.repository }}@${{ steps.platform.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: sbom.linux-${{ matrix.arch }}.spdx.json
          artifact-name: sbom.linux-${{ matrix.arch }}.spdx.json
          upload-release-assets: false # done by the release-sbom job below

      - name: Scan SBOM for vulnerabilities
        id: scan
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        with:
          sbom: sbom.linux-${{ matrix.arch }}.cyclonedx.json
          # Report only: the image is already pushed at this point, so failing here
          # would not prevent publishing, only block the Cloud Run deploy.
          fail-build: false
          severity-cutoff: critical
          output-format: sarif

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: ${{ !cancelled() && steps.scan.outputs.sarif != '' }}
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
          category: grype-container-${{ matrix.arch }}

      - name: Attest SBOM (GHCR)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.platform.outputs.digest }}
          sbom-path: sbom.linux-${{ matrix.arch }}.spdx.json
          push-to-registry: true

      - name: Attest SBOM (GAR)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GAR_IMAGE }}
          subject-digest: ${{ steps.platform.outputs.digest }}
          sbom-path: sbom.linux-${{ matrix.arch }}.spdx.json
          push-to-registry: true

  release-sbom:
    # Attach the SBOMs to the GitHub release of a version tag. Kept as a separate
    # job so that `contents: write` is not granted to the other jobs.
    needs: [docker-build, sbom]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for uploading release assets
    steps:
      - name: Download SBOM artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom.*.json
          merge-multiple: true
          path: sbom

      - name: Upload SBOMs to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: sbom/*.json
          prerelease: ${{ contains(github.ref_name, '-') }}
